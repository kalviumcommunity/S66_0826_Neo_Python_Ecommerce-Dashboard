[project]
name = "s66-0826-neo-python-ecommerce-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryaan007-sudo", email = "blankgaming75@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.30",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
s66-0826-neo-python-ecommerce-dashboard = "server.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "server"
module-root = ""

[tool.vercel]
entrypoint = "server.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
