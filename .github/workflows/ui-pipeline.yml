name: UI-Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  lint-build-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Built
        run: npm run build

      - name: Run quality check(React docter)
        run: npx react-doctor@latest

  deploy:
    needs: lint-build-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploy the application"